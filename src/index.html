<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <title>Jason Kng — Full Stack Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Static copies for link previews and crawlers; the app also sets title/description from resume.data.ts. -->
  <meta name="description" content="Full Stack Developer in Singapore with 5+ years building secure, scalable enterprise software with Java, Spring Boot and Angular.">
  <meta name="theme-color" content="#4f46e5">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jason Kng — Full Stack Developer">
  <meta property="og:description" content="Full Stack Developer in Singapore with 5+ years building secure, scalable enterprise software with Java, Spring Boot and Angular.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <script>
    // Apply the saved theme (or the OS preference) before Angular starts, so there is no flash.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
