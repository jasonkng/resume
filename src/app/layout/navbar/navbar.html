<a class="skip-link visually-hidden-focusable btn btn-accent btn-pill" href="#main">Skip to Main Content</a>

<div class="topbar fixed-top d-lg-none no-print" [class.is-solid]="scrolled() || menuOpen()">
  <nav class="navbar p-0" aria-label="Primary">
    <div class="container-fluid tw:px-4 tw:sm:px-6 d-flex flex-wrap align-items-center tw:min-h-14">
      <a class="topbar-name me-auto" href="#top" (click)="closeMenu()">{{ profile.name }}</a>

      <button
        type="button"
        class="btn btn-icon btn-quiet"
        [attr.aria-label]="themeLabel()"
        [attr.title]="themeLabel()"
        (click)="theme.toggle()"
      >
        <i class="bi" [class.bi-sun]="theme.isDark()" [class.bi-moon]="!theme.isDark()" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        class="btn btn-icon btn-quiet"
        aria-controls="mobile-nav"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation"
        (click)="toggleMenu()"
      >
        <i class="bi" [class.bi-x-lg]="menuOpen()" [class.bi-list]="!menuOpen()" aria-hidden="true"></i>
      </button>

      <div id="mobile-nav" class="collapse w-100" [class.show]="menuOpen()">
        <ul class="list-unstyled tw:pb-3 mb-0">
          @for (section of sections; track section.id) {
            <li>
              <a
                class="topbar-link"
                [href]="'#' + section.id"
                [class.active]="activeId() === section.id"
                [attr.aria-current]="activeId() === section.id ? 'location' : null"
                (click)="closeMenu()"
              >
                {{ section.label }}
              </a>
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</div>
