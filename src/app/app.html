<app-navbar />

<div class="container-xl tw:px-6 tw:md:px-10 tw:lg:px-12">
  <div class="row gx-lg-5">
    <div class="col-lg-5">
      <app-sidebar />
    </div>

    <main id="main" class="col-lg-7 tw:lg:pt-16" tabindex="-1">
      <!-- Sections render in the order (and with the visibility) set in resume.data.ts. -->
      @for (section of sections; track section.id) {
        @switch (section.id) {
          @case ('about') {
            <app-about [config]="section" />
          }
          @case ('skills') {
            <app-skills [config]="section" />
          }
          @case ('experience') {
            <app-experience [config]="section" />
          }
          @case ('education') {
            <app-education [config]="section" />
          }
          @case ('contact') {
            <app-contact [config]="section" />
          }
        }
      }

      <app-footer />
    </main>
  </div>
</div>
