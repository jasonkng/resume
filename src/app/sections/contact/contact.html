<section class="contact section" [id]="config().id" [attr.aria-labelledby]="config().id + '-title'">
  <div class="container-wide">
    <h2 [id]="config().id + '-title'" class="display tw:text-4xl tw:md:text-6xl tw:xl:text-7xl tw:max-w-[18ch] mb-4" appReveal>
      {{ contact.heading }}
    </h2>
    <p class="tw:text-lg tw:md:text-xl tw:max-w-[40rem] mb-5" appReveal="80">{{ contact.message }}</p>

    <div class="d-flex flex-wrap gap-2" appReveal="160">
      @if (profile.email) {
        <a class="btn btn-on-accent d-inline-flex align-items-center gap-3" [href]="'mailto:' + profile.email">
          {{ profile.email }} <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </a>
      }
      @if (profile.phone) {
        <a class="btn btn-outline-light" [href]="'tel:' + profile.phone">{{ profile.phone }}</a>
      }
      @for (link of profile.links; track link.url) {
        <a class="btn btn-outline-light d-inline-flex align-items-center gap-2" [href]="link.url" target="_blank" rel="noopener noreferrer">
          <i [class]="'bi bi-' + link.icon" aria-hidden="true"></i>{{ link.label }}
          <span class="visually-hidden">(opens in a new tab)</span>
        </a>
      }
    </div>
  </div>
</section>
