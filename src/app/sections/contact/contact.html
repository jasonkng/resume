<section class="section" [id]="config().id" [attr.aria-labelledby]="config().id + '-title'">
  <div class="container">
    <div class="contact-card text-center px-4 py-5 p-md-5" appReveal>
      <p class="tw:text-sm tw:font-semibold tw:uppercase tw:tracking-[0.14em] tw:text-white/80 mb-2">
        {{ config().title }}
      </p>
      <h2 [id]="config().id + '-title'" class="tw:text-3xl tw:md:text-5xl tw:font-bold tw:text-white mb-3">
        {{ contact.heading }}
      </h2>
      <p class="tw:text-lg tw:text-white/85 tw:max-w-2xl tw:mx-auto mb-4 mb-md-5">{{ contact.message }}</p>

      <div class="d-flex flex-wrap justify-content-center gap-3">
        @if (profile.email) {
          <a class="btn btn-light btn-lg tw:rounded-full tw:px-6 tw:font-semibold" [href]="'mailto:' + profile.email">
            <i class="bi bi-envelope-fill me-2" aria-hidden="true"></i>{{ profile.email }}
          </a>
        }
        @if (profile.phone) {
          <a class="btn btn-outline-light btn-lg tw:rounded-full tw:px-6" [href]="'tel:' + profile.phone">
            <i class="bi bi-telephone-fill me-2" aria-hidden="true"></i>{{ profile.phone }}
          </a>
        }
        @for (link of profile.links; track link.url) {
          <a
            class="btn btn-outline-light btn-lg tw:rounded-full tw:px-6"
            [href]="link.url"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i [class]="'bi bi-' + link.icon + ' me-2'" aria-hidden="true"></i>{{ link.label }}
            <span class="visually-hidden">(opens in a new tab)</span>
          </a>
        }
      </div>
    </div>
  </div>
</section>
