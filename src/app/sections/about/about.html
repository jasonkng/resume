<section class="section band" [id]="config().id" [attr.aria-labelledby]="config().id + '-title'">
  <div class="container-wide">
    <app-section-heading [title]="config().title" [headingId]="config().id + '-title'" />

    <div class="row">
      <div class="col-lg-9 col-xl-8">
        @for (paragraph of resume.summary; track $index; let first = $first) {
          @if (first) {
            <p class="tw:text-2xl tw:md:text-4xl tw:font-light tw:leading-snug tw:text-ink mb-4" appReveal>{{ paragraph }}</p>
          } @else {
            <p class="tw:text-lg tw:md:text-xl tw:leading-relaxed tw:text-ink tw:max-w-[44rem] mb-3" appReveal="80">
              {{ paragraph }}
            </p>
          }
        }
      </div>
    </div>

    <ul class="row g-4 g-lg-5 list-unstyled mb-0 tw:mt-12 tw:lg:mt-20" aria-label="Career highlights">
      @for (highlight of resume.highlights; track highlight.label; let i = $index) {
        <li class="col-6 col-lg-3" [appReveal]="i * 80">
          <p class="display tabular tw:text-5xl tw:md:text-6xl tw:text-ink mb-2">{{ highlight.value }}</p>
          <p class="tw:text-base tw:text-muted tw:max-w-[16rem] mb-0">{{ highlight.label }}</p>
        </li>
      }
    </ul>
  </div>
</section>
