<section class="section" [id]="config().id" [attr.aria-labelledby]="config().id + '-title'">
  <div class="container-wide">
    <app-section-heading [title]="config().title" [headingId]="config().id + '-title'" />

    <div class="row g-4 g-lg-5">
      @for (entry of education; track $index; let i = $index) {
        <article class="col-md-6" [appReveal]="i * 90">
          <p class="tw:text-lg tw:text-muted tabular mb-2">
            {{ entry.start === entry.end ? entry.end : entry.start + ' – ' + entry.end }}
          </p>
          <h3 class="tw:text-3xl tw:md:text-4xl mb-3">{{ entry.degree }}</h3>
          <p class="tw:text-lg tw:text-ink mb-1">{{ entry.field }}</p>
          <p class="tw:text-lg tw:text-muted mb-0">{{ entry.school }}</p>
        </article>
      }
    </div>
  </div>
</section>
