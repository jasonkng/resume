<section class="section" [id]="config().id" [attr.aria-labelledby]="config().id + '-title'">
  <app-section-heading [title]="config().title" [headingId]="config().id + '-title'" />

  <ol class="list-unstyled d-grid gap-4 mb-0">
    @for (entry of education; track $index; let i = $index) {
      <li class="row g-2 g-md-4" [appReveal]="i * 70">
        <div class="col-md-3">
          <p class="tabular tw:text-[0.8125rem] tw:font-medium tw:text-muted tw:pt-1 mb-0">
            {{ entry.start === entry.end ? entry.end : entry.start + ' – ' + entry.end }}
          </p>
        </div>
        <div class="col-md-9">
          <h3 class="tw:text-lg tw:font-semibold tw:text-ink mb-1">{{ entry.degree }}</h3>
          <p class="tw:text-[0.9375rem] tw:text-ink mb-0">{{ entry.field }}</p>
          <p class="tw:text-sm tw:text-muted mb-0">{{ entry.school }}</p>
        </div>
      </li>
    }
  </ol>
</section>
