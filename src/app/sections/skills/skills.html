<section class="section band" [id]="config().id" [attr.aria-labelledby]="config().id + '-title'">
  <div class="container-wide">
    <app-section-heading [title]="config().title" [headingId]="config().id + '-title'" />

    <dl class="skills-sheet mb-0">
      @for (group of skillGroups; track group.name; let i = $index) {
        <div [appReveal]="(i % 4) * 70">
          <dt class="tw:text-base tw:font-semibold tw:text-ink mb-2">{{ group.name }}</dt>
          <dd class="tw:text-xl tw:md:text-2xl tw:font-light tw:leading-snug tw:text-ink mb-0" translate="no">
            @for (skill of group.skills; track skill; let last = $last) {
              <span class="tw:whitespace-nowrap">{{ skill }}</span>@if (!last) {, }
            }
          </dd>
        </div>
      }
    </dl>
  </div>
</section>
