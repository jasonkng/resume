<section class="section" [id]="config().id" [attr.aria-labelledby]="config().id + '-title'">
  <app-section-heading [title]="config().title" [headingId]="config().id + '-title'" />

  <div class="d-grid gap-4">
    @for (group of skillGroups; track group.name; let i = $index) {
      <div class="row g-2 g-md-4" [appReveal]="(i % 4) * 60">
        <div class="col-md-3">
          <h3 class="tw:text-sm tw:font-medium tw:text-muted tw:pt-1 mb-0">{{ group.name }}</h3>
        </div>
        <div class="col-md-9">
          <ul class="list-unstyled d-flex flex-wrap gap-2 mb-0" translate="no">
            @for (skill of group.skills; track skill) {
              <li class="chip tw:text-ink">{{ skill }}</li>
            }
          </ul>
        </div>
      </div>
    }
  </div>
</section>
